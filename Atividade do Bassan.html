<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Atividade do Bassan</title>
    <style>
        body{
            background-color: cornflowerblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;

        }
        .box-nav{
            background-color: gold;
            padding: 5px;
            border-radius: 15px;
        }
        .box{
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            padding: 15px;
            border-radius: 15px;
            color: white;
        }
        input{
            padding: 10px;
            border: none;
            outline:none;
            border-radius: 10px;
            font-size: 15px;
            width: 50%;
        }
        button{
            padding: 10px;
            border: none;
            outline: none;
            width: 50%;
            background-color: slateblue;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.5s;
        }
        button:hover{
            background-color: cornflowerblue;
        }
    </style>

</head>
</body>
<body>

    <div class="box-nav">
        <h1>Trabalho avulso</h1>
        <h2>para professor Bassan</h2>
    </div>

    <div class="box">
        <p>Mostra a tabela de matemática.</p>
        <input type="number" id="num" placeholder="Digite a todas as tabelas">
        <br><br>

        <button onclick="gerarTabela()">Enviar</button>
    </div>    

    <script>
        function gerarTabela(){
       let num1 = parseInt(document.getElementById("num").value);
       if (num1 >= 1) {
        let mensagem = "resultado da tabela" + num1 + ":\n\n";

            let i = 0;

       while (i < 11){
        let result = num1 * i;
        mensagem += num1 + ' x ' + i + ' = ' + result + "\n";
        i++; 
       }
        alert(mensagem);
       } 
    }  
    </script>
</body>
</html>
