<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Aula 19</title>
    <style>
        body{
            background-color: cornflowerblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;

        }
        .box-nav{
            background-color: gold;
            padding: 5px;
            border-radius: 15px;
        }
        .box{
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            padding: 15px;
            border-radius: 15px;
            color: white;
        }
        input{
            padding: 10px;
            border: none;
            outline:none;
            border-radius: 10px;
            font-size: 15px;
            width: 50%;
        }
        button{
            padding: 10px;
            border: none;
            outline: none;
            width: 50%;
            background-color: slateblue;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.5s;
        }
        button:hover{
            background-color: cornflowerblue;
        }
    </style>

</head>
<body>
    <div class="box-nav">
        <h1>Trabalho avulso</h1>
        <h2>para professor Bassan</h2>
    </div>
    <div class="box">
        <p>Receba a distância percorrida por uma pessoa em km durante uma semana. Considere que ela caminhou a mesma distância todos os dias.</p>
        <input type="number" id ="distância" placeholder="Digite a total percorrida">
        <p id="resultMédia"></p>
        <br></br>

        <button onclick = 'calcular()'>Enviar</button>
    </div>    
</body> 
<script>

    function calcular()
    {
        var distSemana = [5.2, 3.0, 0.0, 55.0, 4.5];

        var distTotal = distSemana.reduce((acc, curr) => acc + curr, 0);

        var mediaDiaria = distTotal / distSemana.length;

        console.log("SEU DIA A DIA");
        console.log(`Distância registradas: ${distSemana.join("km, ")}km`);
        console.log(`Distância total percorrida: ${distTotal.toFixed(2)}km`);
        console.log(`Média diária: ${mediaDiaria.toFixed(2)}km`);

        console.table(distSemana);
    }
</script>
</body>
</html>
