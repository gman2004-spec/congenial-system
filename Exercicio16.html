<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Aula 16</title>
    <style>
        body{
            background-color: cornflowerblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;

        }
        .box-nav{
            background-color: gold;
            padding: 5px;
            border-radius: 15px;
        }
        .box{
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            padding: 15px;
            border-radius: 15px;
            color: white;
        }
        input{
            padding: 10px;
            border: none;
            outline:none;
            border-radius: 10px;
            font-size: 15px;
            width: 50%;
        }
        button{
            padding: 10px;
            border: none;
            outline: none;
            width: 50%;
            background-color: slateblue;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.5s;
        }
        button:hover{
            background-color: cornflowerblue;
        }
    </style>

</head>
<body>
    <div class="box-nav">
        <h1>EXERCÍCIO #11</h1>
        <h2>Disciplina de Algoritmos</h2>
    </div>
<div>
    <div class="box">
        <p>Faça um algoritmo em javascript que, peça dois números e imprima o maior deles</p>
        <input type="number" id="nr1" placeholder="Digite o primeiro número">
        <input type="number" id="nr2" placeholder="Digite o segundo número">
        <br></br>

        <button onclick="verificar()">Enviar</button>
</div>
</body>
<script>

    function verificar()
    {
        var numero1 = document.querySelector('#nr1').value;
        var numero2 = document.querySelector('#nr2').value;

        if (numero1 > numero2) {
            console.log("O primeiro número é maior: " + numero1);
        } else if (numero2 > numero1) {
            console.log("O segundo número é maior: " + numero2);
        } else {
            console.log("Os números são iguais. ");
        }

    }
</script>
</html>
